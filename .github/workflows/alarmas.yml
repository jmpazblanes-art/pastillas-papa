name: Disparar alarmas de pastillas

on:
  schedule:
    # Horas (UTC) que cubren todas las tomas reales en hora España.
    # El script lee el schedule real sincronizado por la app y filtra por la
    # hora real en Madrid; se cubren verano e invierno.
    - cron: '0 5,6,7,8,12,17,18,19,20 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Enviar prueba aunque no toque alarma'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Disparar alarmas
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          FORCE_TEST: ${{ github.event.inputs.force || 'false' }}
          WINDOW_MINUTES: '90'
        run: node scripts/cron-push.js

