name: Disparar alarmas cada 5 minutos

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint de alarmas
        run: |
          curl -s -X POST \
            -H "Content-Type: application/json" \
            -d '{"action":"cron"}' \
            "https://pastillas-papa.vercel.app/api/push?_vercel_share=3Y5iJmdznIhgXtDgYIEmhTxdNw0pepgK" \
            -w "\nHTTP: %{http_code}\n"
