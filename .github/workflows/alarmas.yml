name: Disparar alarmas fijas

on:
  schedule:
    # Minuto exacto de las 4 tomas fijas en hora España.
    # GitHub usa UTC; se cubren verano e invierno y el script filtra por hora real en Madrid.
    - cron: '0 5,6,7,8,17,18,19,20 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Enviar prueba aunque no toque alarma'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Disparar alarmas
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          FORCE_TEST: ${{ github.event.inputs.force || 'false' }}
          FIXED_ONLY: 'true'
          WINDOW_MINUTES: '1'
        run: node scripts/cron-push.js
